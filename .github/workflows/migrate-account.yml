name: Migrate from old Cloudflare account

# Copies the live shop — the D1 database and every product image — from the
# old Cloudflare account into the new one. Cloudflare can't move D1 or R2
# between accounts, so this is a copy; see scripts/migrate-account.py for what
# each step does and README → "Moving Cloudflare accounts" for when to run it.
#
# Safe to run more than once: run it to try the new site out, then again right
# before switching over so the orders placed in between come across too. Every
# run after the first needs "replace" ticked, because it empties the new
# database before importing. Never run it after the switch — it would replace
# the new shop's orders with the old account's.
#
# This repository is public, and so are its Actions logs and artifacts. The
# export never leaves the runner: nothing is uploaded, and the log carries
# only table and row totals.

on:
  workflow_dispatch:
    inputs:
      replace:
        description: "Replace what is in the new database (tick on every run after the first, or once a deploy has seeded it)"
        type: boolean
        default: false

# Shares the deploy's group so a deploy's migrations never interleave with the
# import.
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OLD_CLOUDFLARE_API_TOKEN: ${{ secrets.OLD_CLOUDFLARE_API_TOKEN }}
      OLD_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.OLD_CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check credentials
        run: |
          missing=""
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID OLD_CLOUDFLARE_API_TOKEN OLD_CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing"; exit 1; fi
          if [ "$CLOUDFLARE_ACCOUNT_ID" = "$OLD_CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID and OLD_CLOUDFLARE_ACCOUNT_ID are the same account"; exit 1
          fi
          # Outside the checkout on purpose: with no wrangler config in sight,
          # wrangler finds each database by name in the account the token
          # belongs to, rather than by the new account's id in wrangler.jsonc.
          echo "WORK=$RUNNER_TEMP/migrate" >> "$GITHUB_ENV"
          echo "WRANGLER=$GITHUB_WORKSPACE/node_modules/.bin/wrangler" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/migrate"

      - name: Export the old database
        working-directory: ${{ runner.temp }}/migrate
        run: |
          CLOUDFLARE_API_TOKEN="$OLD_CLOUDFLARE_API_TOKEN" CLOUDFLARE_ACCOUNT_ID="$OLD_CLOUDFLARE_ACCOUNT_ID" \
            "$WRANGLER" d1 export majestic-roobee --remote --skip-confirmation --output old.sql

      - name: Prepare the import
        run: python3 scripts/migrate-account.py prepare "$WORK/old.sql" "$WORK"

      # Images before rows, so no product the new database lists is ever
      # missing its photo.
      - name: Copy product images
        run: python3 scripts/migrate-account.py copy-media "$WORK"

      - name: Empty the new database
        run: python3 scripts/migrate-account.py check-target ${{ inputs.replace && '--replace' || '' }} "$WORK"

      - name: Import into the new database
        run: python3 scripts/migrate-account.py import "$WORK"

      - name: Verify row counts
        run: python3 scripts/migrate-account.py verify "$WORK"

      # The import carries the old database's migration history, so this is a
      # no-op unless this branch has migrations production hadn't run yet.
      - name: Bring the schema up to date
        run: npx wrangler d1 migrations apply majestic-roobee --remote
