name: Backup D1

# Daily off-site export of the production database, kept as a downloadable
# artifact. Cloudflare D1 also keeps 30 days of point-in-time history on its
# side; this is a belt-and-braces second copy.
#
# This repository is public, and so are its artifacts: anyone signed in to
# GitHub can download them. The export holds every order, customer and
# address, so it is encrypted before it is uploaded, and the job refuses to
# run without the passphrase rather than publish it in the clear. To restore:
#
#   openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass pass:'<BACKUP_PASSPHRASE>' \
#     -in majestic-roobee-YYYYMMDD.sql.gz.enc | gunzip > restore.sql
on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC daily
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export and encrypt database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::The repository secret BACKUP_PASSPHRASE is not set. This repository is public, so the backup is not taken rather than published unencrypted."
            exit 1
          fi
          name="majestic-roobee-$(date -u +%Y%m%d).sql"
          # The plaintext stays outside the upload path and is deleted either way.
          trap 'rm -f "$RUNNER_TEMP/$name"' EXIT
          npx wrangler d1 export majestic-roobee --remote --output "$RUNNER_TEMP/$name"
          gzip -c "$RUNNER_TEMP/$name" \
            | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:BACKUP_PASSPHRASE -out "$name.gz.enc"
      - uses: actions/upload-artifact@v4
        with:
          name: d1-backup-${{ github.run_id }}
          path: "*.sql.gz.enc"
          if-no-files-found: error
          retention-days: 30
