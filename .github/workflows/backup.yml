name: Backup D1

# Daily off-site export of the production database, kept as a downloadable
# artifact. Cloudflare D1 also keeps 30 days of point-in-time history on its
# side; this is a belt-and-braces second copy.
on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC daily
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 export majestic-roobee --remote --output "majestic-roobee-$(date -u +%Y%m%d).sql"
      - uses: actions/upload-artifact@v4
        with:
          name: d1-backup-${{ github.run_id }}
          path: "*.sql"
          retention-days: 30
