name: Deploy to Cloudflare

on:
  push:
    branches: [main, claude/cloudflare-deploy-checkout-paystack-8dwtr3]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Static analysis first — `vite build` only transpiles, so it cannot catch
      # things like a hook dep referencing a const declared later (the bug that
      # once shipped a blank storefront). Lint failing blocks the deploy.
      - run: npm run lint

      # Routing decides what a shopper is charged for delivery and which store
      # packs the order; settlement decides whether a charge is allowed to mark
      # an order paid. Both are asserted before anything ships.
      - run: npm run test

      - run: npm run build

      # ---- The gate -------------------------------------------------------
      #
      # This runs BEFORE the deploy, on purpose.
      #
      # It used to run last, against production — which meant a build that
      # white-screened the storefront was already serving customers by the time
      # the check went red. That is exactly how the product page shipped broken:
      # the job failed, but the failure was a report, not a gate.
      #
      # Booting the Worker locally against a freshly migrated database also
      # proves the new code and the new schema agree, which is the other half of
      # what went wrong.
      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Render check (before deploying)
        run: |
          npx wrangler d1 migrations apply majestic-roobee --local
          npx wrangler dev --local --port 8787 --ip 127.0.0.1 &
          echo $! > "${RUNNER_TEMP}/wrangler.pid"
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:8787/api/store; then break; fi
            if [ "$i" = "60" ]; then echo "local Worker never came up"; exit 1; fi
            sleep 2
          done
          SITE_URL=http://127.0.0.1:8787 node scripts/render-check.mjs
          # `npx` spawns workerd underneath it, so killing the pid alone leaves
          # the Worker holding the port.
          pkill -f "wrangler dev" || true
          pkill -f workerd || true

      # ---- Ship -----------------------------------------------------------

      # Migrations go first so the schema is never behind the code that reads
      # it. Version-controlled — no hand-written SQL against the live database.
      - name: Apply database migrations
        run: npx wrangler d1 migrations apply majestic-roobee --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # BUILD_SHA rides along so /api/health can name the build that is
      # answering, and the smoke test below can wait for *this* commit.
      #
      # The address the checks below test is read off wrangler's own output —
      # the workers.dev URL of whichever account the token belongs to — so
      # moving accounts doesn't leave the checks testing the old site. Set the
      # repository variable SITE_URL to test a custom domain instead.
      - name: Deploy Worker
        run: |
          set -o pipefail
          npx wrangler deploy --var BUILD_SHA:${{ github.sha }} | tee "$RUNNER_TEMP/deploy.log"
          url="${SITE_URL_OVERRIDE:-$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -1)}"
          if [ -z "$url" ]; then
            echo "::error::Couldn't tell the site's address from the deploy output. Set the repository variable SITE_URL (Settings → Secrets and variables → Actions → Variables)."
            exit 1
          fi
          echo "SITE_URL=$url" >> "$GITHUB_ENV"
          echo "Live at $url"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITE_URL_OVERRIDE: ${{ vars.SITE_URL }}

      # Worker secrets persist across deploys; each is (re)applied only when
      # the matching GitHub secret is present.
      - name: Sync Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_TOKEN_SECRET: ${{ secrets.ADMIN_TOKEN_SECRET }}
          PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
          ERP_API_KEY: ${{ secrets.ERP_API_KEY }}
          ERP_API_SECRET: ${{ secrets.ERP_API_SECRET }}
          ERP_WEBHOOK_SECRET: ${{ secrets.ERP_WEBHOOK_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          RESEND_REPLY_TO: ${{ secrets.RESEND_REPLY_TO }}
        run: |
          if [ -n "$ADMIN_PASSWORD" ]; then printf '%s' "$ADMIN_PASSWORD" | npx wrangler secret put ADMIN_PASSWORD; fi
          if [ -n "$ADMIN_TOKEN_SECRET" ]; then printf '%s' "$ADMIN_TOKEN_SECRET" | npx wrangler secret put ADMIN_TOKEN_SECRET; fi
          if [ -n "$PAYSTACK_SECRET_KEY" ]; then printf '%s' "$PAYSTACK_SECRET_KEY" | npx wrangler secret put PAYSTACK_SECRET_KEY; fi
          if [ -n "$ERP_API_KEY" ]; then printf '%s' "$ERP_API_KEY" | npx wrangler secret put ERP_API_KEY; fi
          if [ -n "$ERP_API_SECRET" ]; then printf '%s' "$ERP_API_SECRET" | npx wrangler secret put ERP_API_SECRET; fi
          if [ -n "$ERP_WEBHOOK_SECRET" ]; then printf '%s' "$ERP_WEBHOOK_SECRET" | npx wrangler secret put ERP_WEBHOOK_SECRET; fi
          if [ -n "$RESEND_API_KEY" ]; then printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY; fi
          if [ -n "$RESEND_FROM" ]; then printf '%s' "$RESEND_FROM" | npx wrangler secret put RESEND_FROM; fi
          if [ -n "$RESEND_REPLY_TO" ]; then printf '%s' "$RESEND_REPLY_TO" | npx wrangler secret put RESEND_REPLY_TO; fi

      # ---- Confirm what actually went live --------------------------------
      #
      # A new Worker version does not reach every edge the instant `deploy`
      # returns, and the assets and the script are two uploads. So this waits
      # until /api/health reports the commit that was just pushed. Anything
      # weaker is not a gate: a check for a field the *previous* build already
      # served passes immediately and proves nothing, which is exactly how a
      # smoke test came to assert against the old Worker and pass.
      - name: Smoke test live site
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          echo "— waiting for $EXPECTED_SHA to serve —"
          for i in $(seq 1 45); do
            live=$(curl -sfS "$SITE_URL/api/health" | python3 -c "import json,sys; print(json.load(sys.stdin).get('version',''))" 2>/dev/null || true)
            if [ "$live" = "$EXPECTED_SHA" ]; then echo "live build is $live"; break; fi
            if [ "$i" = "45" ]; then echo "live build is '$live', expected '$EXPECTED_SHA' — deploy never propagated"; exit 1; fi
            sleep 4
          done
          echo "— storefront shell —"
          curl -sfS "$SITE_URL/" | grep -o '<title>[^<]*</title>'
          echo "— admin shell —"
          curl -sfS "$SITE_URL/admin/" | grep -o '<title>[^<]*</title>'
          echo "— store bootstrap —"
          products=$(curl -sfS "$SITE_URL/api/store" | python3 -c "import json,sys; d=json.load(sys.stdin); print(len(d['products']))")
          echo "live products: $products"; test "$products" -ge 1
          # Tracking is checked through its rejection path, not a known order.
          # The sample data is gone, and a real order number can't be asserted
          # here anyway — this still exercises the route, the database read and
          # the JSON error contract the storefront relies on.
          echo "— order tracking (unknown order rejects cleanly) —"
          code=$(curl -s -o "${RUNNER_TEMP:-.}/track.json" -w '%{http_code}' "$SITE_URL/api/orders/track?no=MR-00000&contact=none@example.com")
          echo "unknown order -> HTTP $code"; test "$code" = "404"
          python3 -c "import json; d=json.load(open('${RUNNER_TEMP:-.}/track.json')); assert d.get('error'), d; print('error surfaced:', d['error'])"
          echo "— admin auth rejects bad passphrase —"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$SITE_URL/api/admin/login" -H 'content-type: application/json' -d '{"password":"definitely-wrong"}')
          echo "bad login -> HTTP $code"; test "$code" = "401"
          # A forged webhook must never settle an order. Cheap to assert, and
          # the one failure here that would cost real money.
          echo "— unsigned Paystack webhook is refused —"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$SITE_URL/api/paystack/webhook" -H 'content-type: application/json' -d '{"event":"charge.success","data":{"reference":"forged"}}')
          echo "forged webhook -> HTTP $code"; test "$code" = "401" -o "$code" = "400"
          # Same for the ERP: an unsigned delivery must never set stock.
          echo "— unsigned ERP webhook is refused —"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$SITE_URL/api/erp/webhook" -H 'content-type: application/json' -d '{"event":"stock.updated","data":{"product_id":1,"quantity":0}}')
          echo "forged ERP webhook -> HTTP $code"; test "$code" = "401" -o "$code" = "503"
          echo "All smoke tests passed."

      - name: Render check (live)
        run: node scripts/render-check.mjs
