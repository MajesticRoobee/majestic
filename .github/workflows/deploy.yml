name: Deploy to Cloudflare

on:
  push:
    branches: [main, claude/majestic-roobee-ecommerce-aagopj]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Static analysis first — `vite build` only transpiles, so it cannot catch
      # things like a hook dep referencing a const declared later (the bug that
      # once shipped a blank storefront). Lint failing blocks the deploy.
      - run: npm run lint

      - run: npm run build

      # Apply any pending D1 migrations to production before the new Worker
      # goes live, so schema and code stay in lock-step. Version-controlled —
      # no hand-written SQL against the live database.
      - name: Apply database migrations
        run: npx wrangler d1 migrations apply majestic-roobee --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Worker secrets persist across deploys; each is (re)applied only when
      # the matching GitHub secret is present.
      - name: Sync Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_TOKEN_SECRET: ${{ secrets.ADMIN_TOKEN_SECRET }}
          PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
        run: |
          if [ -n "$ADMIN_PASSWORD" ]; then printf '%s' "$ADMIN_PASSWORD" | npx wrangler secret put ADMIN_PASSWORD; fi
          if [ -n "$ADMIN_TOKEN_SECRET" ]; then printf '%s' "$ADMIN_TOKEN_SECRET" | npx wrangler secret put ADMIN_TOKEN_SECRET; fi
          if [ -n "$PAYSTACK_SECRET_KEY" ]; then printf '%s' "$PAYSTACK_SECRET_KEY" | npx wrangler secret put PAYSTACK_SECRET_KEY; fi

      - name: Smoke test live site
        env:
          SITE_URL: https://majestic-roobee.victorugwu4real.workers.dev
        run: |
          sleep 5
          echo "— storefront shell —"
          curl -sfS "$SITE_URL/" | grep -o '<title>[^<]*</title>'
          echo "— admin shell —"
          curl -sfS "$SITE_URL/admin/" | grep -o '<title>[^<]*</title>'
          echo "— store bootstrap —"
          products=$(curl -sfS "$SITE_URL/api/store" | python3 -c "import json,sys; d=json.load(sys.stdin); print(len(d['products']))")
          echo "live products: $products"; test "$products" -ge 1
          # Tracking is checked through its rejection path, not a known order.
          # The sample data is gone, and a real order number can't be asserted
          # here anyway — this still exercises the route, the database read and
          # the JSON error contract the storefront relies on.
          echo "— order tracking (unknown order rejects cleanly) —"
          code=$(curl -s -o "${RUNNER_TEMP:-.}/track.json" -w '%{http_code}' "$SITE_URL/api/orders/track?no=MR-00000&contact=none@example.com")
          echo "unknown order -> HTTP $code"; test "$code" = "404"
          python3 -c "import json; d=json.load(open('${RUNNER_TEMP:-.}/track.json')); assert d.get('error'), d; print('error surfaced:', d['error'])"
          echo "— admin auth rejects bad passphrase —"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$SITE_URL/api/admin/login" -H 'content-type: application/json' -d '{"password":"definitely-wrong"}')
          echo "bad login -> HTTP $code"; test "$code" = "401"
          echo "All smoke tests passed."

      - name: Render check (headless browser)
        env:
          SITE_URL: https://majestic-roobee.victorugwu4real.workers.dev
        run: |
          npm i -D playwright@1.48.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium
          node scripts/render-check.mjs
